name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Sync and verify
        run: |
          uv sync --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run lint

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t financial-tracker-api ./backend
      - name: Build web image
        run: docker build -t financial-tracker-web ./frontend

  # Always runs so it can be a required check without "skipped = blocking".
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce develop → master only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "master" ]; then
            if [ "${{ github.head_ref }}" != "develop" ]; then
              echo "::error::PRs into master must come from develop (got '${{ github.head_ref }}')"
              exit 1
            fi
            echo "OK: develop → master"
          else
            echo "OK: not a master PR"
          fi
